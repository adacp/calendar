    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
			background: linear-gradient(135deg, #e8dcc4 0%, #d4c5a9 100%);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(120, 100, 80, 0.03) 0%, transparent 50%);
        }
		.paper-texture {
            background-image: 
                repeating-linear-gradient(90deg, rgba(0,0,0,0.01) 0px, transparent 2px, transparent 4px, rgba(0,0,0,0.01) 6px),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.01) 0px, transparent 2px, transparent 4px, rgba(0,0,0,0.01) 6px);
        }
				
		.calendar-month {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        
		
        .day-cell {
            aspect-ratio: 1 / 1.2;
        }
        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
		@keyframes starBounce {
			0%, 100% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
			10% { transform: translate(-50%, -50%) scale(1.5) rotate(72deg); opacity: 1; }
			90% { transform: translate(-50%, -50%) scale(1.5) rotate(648deg); opacity: 1; }
		}

		@keyframes starFloat {
			0% { transform: translateY(0px) rotate(0deg); }
			50% { transform: translateY(-20px) rotate(180deg); }
			100% { transform: translateY(0px) rotate(360deg); }
		}

		.mario-star {
			width: 100px;
			height: 100px;
			position: relative;
			animation: starFloat 2s ease-in-out infinite;
		}

    </style>
</head>

        // Función de confetti
        function createConfetti() {
            const colors = ['#ec4899', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
            const confettiCount = 50;
            const container = document.createElement('div');
            container.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;';
            document.body.appendChild(container);
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const animDuration = 2 + Math.random() * 2;
                const size = 5 + Math.random() * 5;
                
                confetti.style.cssText = `
                    position: absolute;
                    left: ${left}%;
                    top: -10px;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    opacity: 1;
                    transform: rotate(${Math.random() * 360}deg);
                    animation: confettiFall ${animDuration}s ease-out forwards;
                `;
                container.appendChild(confetti);
            }
            
            setTimeout(() => container.remove(), 4000);
        }

		function playMarioStarSound() {
			// Crear contexto de audio
			const audioContext = new (window.AudioContext || window.webkitAudioContext)();
			
			// Notas de la melodía de la estrella de Mario (frecuencias en Hz)
			const notes = [
				{ freq: 523.25, duration: 0.1 },  // C5
				{ freq: 659.25, duration: 0.1 },  // E5
				{ freq: 783.99, duration: 0.1 },  // G5
				{ freq: 1046.50, duration: 0.15 }, // C6
				{ freq: 783.99, duration: 0.1 },  // G5
				{ freq: 1046.50, duration: 0.3 }  // C6 (más largo)
			];
			
			let currentTime = audioContext.currentTime;
			
			notes.forEach(note => {
				const oscillator = audioContext.createOscillator();
				const gainNode = audioContext.createGain();
				
				oscillator.connect(gainNode);
				gainNode.connect(audioContext.destination);
				
				oscillator.frequency.value = note.freq;
				oscillator.type = 'square'; // Sonido retro tipo Mario
				
				gainNode.gain.setValueAtTime(0.3, currentTime);
				gainNode.gain.exponentialRampToValueAtTime(0.01, currentTime + note.duration);
				
				oscillator.start(currentTime);
				oscillator.stop(currentTime + note.duration);
				
				currentTime += note.duration;
			});
		}

        // Funciones de almacenamiento
        function loadEvents() {
            try {
                const saved = localStorage.getItem('calendar-events');
                if (saved) state.events = JSON.parse(saved);
            } catch (e) {}
        }

        function saveEvents() {
            localStorage.setItem('calendar-events', JSON.stringify(state.events));
        }

        function loadMonthImages() {
            try {
                const saved = localStorage.getItem('calendar-month-images');
                if (saved) state.monthImages = JSON.parse(saved);
            } catch (e) {}
        }

        function saveMonthImages() {
            localStorage.setItem('calendar-month-images', JSON.stringify(state.monthImages));
        }

        function loadStats() {
            try {
                const saved = localStorage.getItem('calendar-stats');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { totalPoints: 0, lastEventDate: null, eventsPerMonth: {} };
        }

        function saveStats(stats) {
            localStorage.setItem('calendar-stats', JSON.stringify(stats));
        }

        function getEventsPerMonth() {
            const eventsPerMonth = {};
            state.events.forEach(event => {
                const date = new Date(event.date);
                const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                eventsPerMonth[monthKey] = (eventsPerMonth[monthKey] || 0) + 1;
            });
            return eventsPerMonth;
        }

        function updatePoints() {
            const stats = loadStats();
            const today = new Date().toDateString();
            
            if (stats.lastEventDate !== today) {
                stats.totalPoints += 1;
                stats.lastEventDate = today;
                
                const newEventsPerMonth = getEventsPerMonth();
                const currentMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
                const currentMonthEvents = newEventsPerMonth[currentMonth] || 0;
                const previousRecord = stats.eventsPerMonth[currentMonth] || 0;
                
                stats.eventsPerMonth = newEventsPerMonth;
                saveStats(stats);
                
                if (currentMonthEvents > previousRecord && currentMonthEvents > 5) {
                    createConfetti();
                    setTimeout(() => {
                        alert(`🎉 ¡NUEVO RÉCORD! ${currentMonthEvents} eventos este mes. ¡Sigue así!`);
                    }, 500);
                }
                
                return true;
            }
            
            return false;
        }

        function getStatsDisplay() {
            const stats = loadStats();
            const eventsPerMonth = getEventsPerMonth();
            const currentMonth = `${state.selectedDate.getFullYear()}-${String(state.selectedDate.getMonth() + 1).padStart(2, '0')}`;
            const currentMonthEvents = eventsPerMonth[currentMonth] || 0;
            
            return { points: stats.totalPoints, currentMonthEvents, eventsPerMonth };
        }

        function getCurrentMonthImage() {
            const key = `${state.selectedDate.getFullYear()}-${state.selectedDate.getMonth()}`;
            return state.monthImages[key];
        }

        function getDaysInMonth(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            let startingDay = firstDay.getDay();
            startingDay = startingDay === 0 ? 6 : startingDay - 1;
            
            return {
                daysInMonth: lastDay.getDate(),
                startingDayOfWeek: startingDay
            };
        }

        function getEventsForDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            return state.events.filter(e => {
                if (!e.endDate || e.endDate === e.date) {
                    return e.date === dateStr;
                }
                
                const eventStart = new Date(e.date + 'T00:00:00');
                const eventEnd = new Date(e.endDate + 'T00:00:00');
                const currentDate = new Date(dateStr + 'T00:00:00');
                
                return currentDate >= eventStart && currentDate <= eventEnd;
            }).map(e => {
                if (e.endDate && e.endDate !== e.date) {
                    const eventStart = new Date(e.date + 'T00:00:00');
                    const eventEnd = new Date(e.endDate + 'T00:00:00');
                    const currentDate = new Date(dateStr + 'T00:00:00');
                    
                    if (currentDate.getTime() === eventStart.getTime()) {
                        return { ...e, position: 'start' };
                    } else if (currentDate.getTime() === eventEnd.getTime()) {
                        return { ...e, position: 'end' };
                    } else {
                        return { ...e, position: 'middle' };
                    }
                }
                return { ...e, position: 'single' };
            });
        }

        function formatDate(dateStr) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        // Renderizar la aplicación
        function render() {
            const currentImage = getCurrentMonthImage();
            const { daysInMonth, startingDayOfWeek } = getDaysInMonth(state.selectedDate);
            const statsData = getStatsDisplay();
            
            const upcomingEvents = [...state.events]
                .sort((a, b) => {
                    const dateA = new Date(a.date + ' ' + (a.time || '00:00'));
                    const dateB = new Date(b.date + ' ' + (b.time || '00:00'));
                    return dateA - dateB;
                })
                .filter(e => new Date(e.date + 'T00:00:00') >= new Date(new Date().toDateString()));

            let calendarCells = '';
            for (let i = 0; i < startingDayOfWeek; i++) {
                calendarCells += '<div class="day-cell"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), day);
                const dayEvents = getEventsForDate(date);
                const isToday = new Date().toDateString() === date.toDateString();
                
                let eventsHtml = '';
                if (dayEvents.length > 0) {
                    eventsHtml += '<div class="flex gap-1 mt-1 md:hidden">';
                    dayEvents.slice(0, 3).forEach(event => {
                        const cat = categories[event.category] || categories.ocio;
                        eventsHtml += `<div class="w-2 h-2 rounded-full" style="background-color: ${cat.dot}"></div>`;
                    });
                    if (dayEvents.length > 3) {
                        eventsHtml += '<div class="w-2 h-2 bg-gray-400 rounded-full"></div>';
                    }
                    eventsHtml += '</div>';
                    
                    eventsHtml += '<div class="hidden md:flex md:flex-col md:gap-0.5">';
                    dayEvents.slice(0, 2).forEach(event => {
                        const cat = categories[event.category] || categories.ocio;
                        let symbol = '';
                        if (event.position === 'start') symbol = '► ';
                        else if (event.position === 'middle') symbol = '─ ';
                        else if (event.position === 'end') symbol = '◄ ';
                        
                        eventsHtml += `<div class="text-xs ${cat.color} text-white rounded px-1 truncate" title="${event.title}">${symbol}${event.title}</div>`;
                    });
                    if (dayEvents.length > 2) {
                        eventsHtml += `<div class="text-xs text-gray-500">+${dayEvents.length - 2}</div>`;
                    }
                    eventsHtml += '</div>';
                }

                calendarCells += `
                    <div onclick="handleDayClick(${day})" 
                         class="day-cell border rounded-lg p-1 flex flex-col cursor-pointer transition hover:shadow-md ${isToday ? 'bg-blue-50 border-blue-500' : 'border-gray-200 hover:border-purple-300'}">
                        <div class="text-sm font-semibold ${isToday ? 'text-blue-600' : 'text-gray-700'}">${day}</div>
                        <div class="flex-1 flex flex-col gap-0.5 mt-1 overflow-hidden">${eventsHtml}</div>
                    </div>
                `;
            }

            let upcomingHtml = '';
            if (upcomingEvents.length > 0) {
                upcomingEvents.slice(0, 5).forEach(event => {
                    const cat = categories[event.category] || categories.ocio;
                    upcomingHtml += `
                        <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <div class="w-3 h-3 rounded-full" style="background-color: ${cat.dot}"></div>
                                        <span class="text-xs font-semibold text-gray-500 uppercase">${cat.name}</span>
                                    </div>
                                    <h3 class="font-semibold text-gray-800 text-lg">${event.title}</h3>
                                    <div class="flex items-center gap-4 mt-2 text-sm text-gray-600">
                                        <span>📅 ${formatDate(event.date)}${event.endDate && event.endDate !== event.date ? ' - ' + formatDate(event.endDate) : ''}</span>
                                        ${event.time ? `<span class="flex items-center gap-1">${icons.clock} ${event.time}</span>` : ''}
                                    </div>
                                    ${event.description ? `<p class="text-gray-600 mt-2">${event.description}</p>` : ''}
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="editEvent('${event.id}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg transition">${icons.edit}</button>
                                    <button onclick="deleteEvent('${event.id}')" class="text-red-600 hover:bg-red-50 p-2 rounded-lg transition">${icons.trash}</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            const monthsShort = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            const currentYear = new Date().getFullYear();
            const maxEvents = Math.max(...Object.values(statsData.eventsPerMonth), 1);

            const html = `
                <div class="min-h-screen p-4 paper-texture">
                    <div class="max-w-4xl mx-auto">
                        ${state.showInstallButton ? `
                            <div class="bg-purple-600 text-white p-4 rounded-2xl shadow-lg mb-4 flex items-center justify-between paper-texture">
                                <div class="flex-1">
                                    <p class="font-semibold">📱 Instala la app en tu móvil</p>
                                    <p class="text-sm text-purple-100">Accede más rápido a tu calendario</p>
                                </div>
                                <button onclick="installApp()" class="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition flex items-center gap-2">
                                    ${icons.download} Instalar
                                </button>
                            </div>
                        ` : ''}

                        

                        <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-6 paper-texture">
                            ${currentImage ? `
                                <div class="relative h-56 overflow-hidden group">
                                    <img src="${currentImage}" alt="Banner" class="w-full h-full object-cover opacity-80">
                                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/50 flex items-end">
                                        <h2 class="text-white calendar-month text-4xl p-6">${months[state.selectedDate.getMonth()]} ${state.selectedDate.getFullYear()}</h2>
                                    </div>
                                    <button onclick="removeMonthImage()" class="absolute top-4 right-4 bg-red-500 text-white p-2 rounded-lg opacity-0 group-hover:opacity-100 transition">${icons.x}</button>
                                </div>
                            ` : `
                                <div onclick="state.showImageUpload = true; render();" class="h-48 bg-gradient-to-r from-purple-400 to-blue-400 flex flex-col items-center justify-center cursor-pointer hover:from-purple-500 hover:to-blue-500 transition">
                                    ${icons.upload}
                                    <p class="text-white text-lg font-semibold">Añadir imagen del mes</p>
                                    <p class="text-purple-100 text-sm">Click para subir</p>
                                </div>
                            `}

                            <div class="p-6">
                                <div class="flex items-center justify-between mb-4">
                                    <button onclick="changeMonth(-1)" class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">← Anterior</button>
                                    <button onclick="changeMonth(1)" class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">Siguiente →</button>
                                </div>

                                <div class="grid grid-cols-7 gap-2 mb-2">
                                    ${days.map(d => `<div class="text-center font-semibold text-gray-600 text-sm">${d}</div>`).join('')}
                                </div>

                                <div class="grid grid-cols-7 gap-2">${calendarCells}</div>

                                <p class="text-sm text-gray-500 mt-4 text-center">💡 Click en cualquier día para añadir un evento</p>
                            </div>
                        </div>
						
						<div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                            <div class="flex items-center justify-between mb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-gray-800">Tu Progreso</h3>
                                    <p class="text-sm text-gray-500">Sigue añadiendo eventos para ganar puntos</p>
                                </div>
                                <div class="text-right">
                                    <div class="text-3xl font-bold text-purple-600">${statsData.points}</div>
                                    <div class="text-sm text-gray-500">Puntos totales</div>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-12 gap-2 items-end h-32 bg-gradient-to-t from-purple-50 to-transparent rounded-lg p-4">
                                ${monthsShort.map((month, idx) => {
                                    const monthKey = `${currentYear}-${String(idx + 1).padStart(2, '0')}`;
                                    const count = statsData.eventsPerMonth[monthKey] || 0;
                                    const height = maxEvents > 0 ? (count / maxEvents) * 100 : 0;
                                    const isCurrentMonth = monthKey === `${state.selectedDate.getFullYear()}-${String(state.selectedDate.getMonth() + 1).padStart(2, '0')}`;
                                    
                                    return `
                                        <div class="flex flex-col items-center gap-1">
                                            <div class="text-xs font-semibold ${count > 0 ? 'text-purple-600' : 'text-gray-400'}">${count || ''}</div>
                                            <div class="w-full ${isCurrentMonth ? 'bg-purple-600' : 'bg-purple-400'} rounded-t transition-all" style="height: ${Math.max(height, 5)}%;"></div>
                                            <div class="text-xs text-gray-600 font-medium mt-1">${month}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            
                            <div class="mt-4 text-center">
                                <p class="text-sm text-gray-600">
                                    Este mes: <span class="font-bold text-purple-600">${statsData.currentMonthEvents} eventos</span>
                                    ${statsData.currentMonthEvents > 0 ? ' 🎯' : ''}
                                </p>
                            </div>
                        </div>

                        ${upcomingEvents.length > 0 ? `
                            <div class="bg-white rounded-2xl shadow-xl p-6">
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">Próximos Eventos</h2>
                                <div class="space-y-3">${upcomingHtml}</div>
                            </div>
                        ` : ''}
                    </div>

                    ${state.showImageUpload ? `
                        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
                                <div class="flex justify-between items-center mb-4">
                                    <h2 class="text-2xl font-bold text-gray-800">Imagen para ${months[state.selectedDate.getMonth()]}</h2>
                                    <button onclick="state.showImageUpload = false; render();" class="text-gray-500 hover:bg-gray-100 p-2 rounded-lg transition">${icons.x}</button>
                                </div>
                                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-purple-500 transition">
                                    <input type="file" accept="image/*" onchange="handleImageUpload(event)" id="imageUpload" class="hidden">
                                    <label for="imageUpload" class="cursor-pointer">
                                        <div class="text-gray-400 mb-2">${icons.upload}</div>
                                        <p class="text-gray-600 mb-4">Selecciona una imagen</p>
                                        <span class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition inline-block">Elegir archivo</span>
                                        <p class="text-sm text-gray-500 mt-2">JPG, PNG o GIF</p>
                                    </label>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${state.showForm ? `
                        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
                                <div class="flex justify-between items-center mb-4">
                                    <h2 class="text-2xl font-bold text-gray-800">${state.editingId ? 'Editar Evento' : 'Nuevo Evento'}</h2>
                                    <button onclick="closeForm()" class="text-gray-500 hover:bg-gray-100 p-2 rounded-lg transition">${icons.x}</button>
                                </div>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Título *</label>
                                        <input type="text" id="eventTitle" value="${state.formData.title}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="Cumpleaños, cita, reunión...">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Categoría *</label>
                                        <select id="eventCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
											<option value="viajes" ${state.formData.category === 'viajes' ? 'selected' : ''}>🟠 Viajes</option>
											<option value="fujem" ${state.formData.category === 'fujem' ? 'selected' : ''}>🔵 Fujem</option>
											<option value="fujem" ${state.formData.category === 'fujem' ? 'selected' : ''}>🟢 Comunio</option>
											<option value="comedia" ${state.formData.category === 'comedia' ? 'selected' : ''}>🟡 Comedia</option>
											<option value="ocio" ${state.formData.category === 'ocio' ? 'selected' : ''}>🟣 Ocio</option>
											<option value="cumpleanos" ${state.formData.category === 'cumpleanos' ? 'selected' : ''}>🟤 Cumpleaños</option>
										</select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha de inicio *</label>
                                        <input type="date" id="eventDate" value="${state.formData.date}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha de fin (opcional)</label>
                                        <input type="date" id="eventEndDate" value="${state.formData.endDate}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                        <p class="text-xs text-gray-500 mt-1">Deja vacío si es un evento de un solo día</p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Hora (opcional)</label>
                                        <input type="time" id="eventTime" value="${state.formData.time}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Descripción (opcional)</label>
                                        <textarea id="eventDesc" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="Detalles adicionales...">${state.formData.description}</textarea>
                                    </div>
                                    <div class="flex gap-3 pt-4">
                                        <button onclick="closeForm()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancelar</button>
                                        <button onclick="saveEvent()" class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">${state.editingId ? 'Guardar' : 'Crear'}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('root').innerHTML = html;
        }

        // Funciones de eventos
        function handleDayClick(day) {
            const year = state.selectedDate.getFullYear();
            const month = String(state.selectedDate.getMonth() + 1).padStart(2, '0');
            const dayStr = String(day).padStart(2, '0');
            state.formData = { title: '', date: `${year}-${month}-${dayStr}`, endDate: '', time: '', description: '', category: 'viajes' };
            state.editingId = null;
            state.showForm = true;
            render();
        }

        function editEvent(id) {
            const event = state.events.find(e => e.id === id);
            state.formData = { ...event };
            state.editingId = id;
            state.showForm = true;
            render();
        }

        function deleteEvent(id) {
            if (confirm('¿Eliminar este evento?')) {
                state.events = state.events.filter(e => e.id !== id);
                saveEvents();
                render();
            }
        }

        function closeForm() {
            state.showForm = false;
            state.formData = { title: '', date: '', endDate: '', time: '', description: '', category: 'cumpleanos' };
            state.editingId = null;
            render();
        }

        function saveEvent() {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const endDate = document.getElementById('eventEndDate').value;
            const time = document.getElementById('eventTime').value;
            const description = document.getElementById('eventDesc').value;
            const category = document.getElementById('eventCategory').value;

            if (!title || !date) {
                alert('Por favor completa título y fecha');
                return;
            }

            if (endDate && endDate < date) {
                alert('La fecha de fin no puede ser anterior a la fecha de inicio');
                return;
            }

            if (state.editingId) {
                state.events = state.events.map(e => 
                    e.id === state.editingId ? { id: state.editingId, title, date, endDate, time, description, category } : e
                );
            } else {
                state.events.push({ id: Date.now().toString(), title, date, endDate, time, description, category });
            }

            saveEvents();
			
			// Siempre mostrar estrella de Mario al crear evento
			createMarioStar();
            
            const pointAdded = updatePoints();
			if (pointAdded) {
				const stats = loadStats();
				
								
				// Mensaje después de la animación
				setTimeout(() => {
					const messages = [
						`⭐ +1 punto! Llevas ${stats.totalPoints} puntos totales`,
						`🌟 ¡Genial! ${stats.totalPoints} puntos acumulados`,
						`✨ +1 punto! Tu calendario cobra vida`,
						`🎯 ¡Excelente! Ya tienes ${stats.totalPoints} puntos`
					];
					const randomMsg = messages[Math.floor(Math.random() * messages.length)];
					alert(randomMsg);
				}, 2100); // Esperar a que termine la animación
			}
            
            closeForm();
        }

        function changeMonth(delta) {
            state.selectedDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth() + delta, 1);
            render();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const key = `${state.selectedDate.getFullYear()}-${state.selectedDate.getMonth()}`;
                state.monthImages[key] = event.target.result;
                saveMonthImages();
                state.showImageUpload = false;
                render();
            };
            reader.readAsDataURL(file);
        }

        function removeMonthImage() {
            const key = `${state.selectedDate.getFullYear()}-${state.selectedDate.getMonth()}`;
            delete state.monthImages[key];
            saveMonthImages();
            render();
        }

        function installApp() {
            if (state.deferredPrompt) {
                state.deferredPrompt.prompt();
                state.deferredPrompt.userChoice.then(() => {
                    state.showInstallButton = false;
                    state.deferredPrompt = null;
                    render();
                });
            }
        }

        // Inicializar
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            state.deferredPrompt = e;
            state.showInstallButton = true;
            render();
        });

        window.addEventListener('load', () => {
            loadEvents();
            loadMonthImages();
            loadStats();
            render();
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registrado'))
                .catch(err => console.log('Error Service Worker', err));
        }
    </script>
</body>
</html>
